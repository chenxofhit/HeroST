[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heroST"
version = "0.1.0"
description = "HERO-ST: structure-guided, uncertainty-aware, heterogeneity-preserving H&E to spatial transcriptomics representation learning"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
  "torch>=2.2",
  "numpy>=1.26,<3.0",
  "scipy>=1.11",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]
real-data = [
  "huggingface_hub>=0.24",
  "h5py>=3.10",
  "anndata>=0.10",
  "transformers>=4.40,<5",
]

[project.scripts]
herost-train = "heroST.train:main"
herost-evaluate = "heroST.evaluate:main"

[project.urls]
Repository = "https://github.com/chenxofhit/HeroST"

[tool.setuptools.packages.find]
include = ["heroST*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
